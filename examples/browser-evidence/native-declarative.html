<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Dual Surface UI native declarative evidence</title>
  </head>
  <body>
    <h1>Native declarative WebMCP evidence</h1>
    <form id="profile" action="/examples/browser-evidence/native-declarative.html">
      <label>Display name <input id="display-name" name="displayName" required></label>
      <label>Biography <textarea id="biography" name="biography"></textarea></label>
      <button type="submit">Review and submit</button>
    </form>
    <output id="native-declarative-status">Loading</output>
    <script type="module" src="/examples/browser-evidence/native-declarative.mjs"></script>
  </body>
</html>
